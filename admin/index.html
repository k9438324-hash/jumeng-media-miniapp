<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>聚梦传媒 · 老师管理台</title>
<style>
:root{--bg:#f5f1e8;--surface:#fbf8f1;--ink:#1c1b19;--muted:#5e5a52;--line:#e4ded0;--warn:#b4531a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header{max-width:1280px;margin:auto;padding:28px 32px 20px;border-bottom:1px solid var(--line)}h1{font-family:SimSun,serif;font-size:28px;margin:0 0 8px}h2{font-family:SimSun,serif;font-size:24px;margin:0 0 16px}h3{margin:20px 0 12px;font-size:17px}.muted,small{color:var(--muted)}nav{display:flex;gap:24px;margin-top:20px}button{cursor:pointer;font:inherit;border:1px solid var(--line);background:transparent;border-radius:8px;padding:9px 16px;min-height:44px;color:var(--ink)}button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}button:disabled{opacity:.45;cursor:wait}nav button{border:0;border-radius:0;padding:8px 0}nav button.active{border-bottom:2px solid var(--ink)}main{max-width:1280px;margin:auto;padding:24px 32px;display:grid;grid-template-columns:290px minmax(0,1fr);gap:32px}aside{border-right:1px solid var(--line);padding-right:24px}.list-item{display:block;text-align:left;width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:16px 4px}.list-item.active{background:#ece6d8}small{display:block;font-size:12px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}label{display:block;color:var(--muted);margin:12px 0 4px;font-size:13px}input,textarea,select{display:block;width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px;min-height:44px}textarea{resize:vertical;min-height:74px}input[readonly]{color:var(--muted);font-size:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.shot{border-top:1px solid var(--line);padding:12px 0 22px}.shot h3{display:flex;justify-content:space-between;align-items:center}.notice{padding:12px 16px;border:1px solid var(--line);border-radius:6px;margin:16px 0;background:var(--surface)}#status{padding:0 32px;max-width:1280px;margin:12px auto;min-height:25px;color:var(--warn)}.hidden{display:none!important}.stats{display:flex;gap:32px;flex-wrap:wrap;padding:20px 0;border-block:1px solid var(--line)}.stats b{display:block;font-size:26px}table{width:100%;border-collapse:collapse;margin:16px 0}td,th{text-align:left;border-bottom:1px solid var(--line);padding:12px 8px;font-weight:400}th{color:var(--muted);font-size:13px}.auth{max-width:600px;margin:32px auto;padding:24px}pre{white-space:pre-wrap}a{color:var(--ink)}@media(max-width:800px){main{grid-template-columns:1fr;padding:16px}aside{border:0;padding:0}.fields{grid-template-columns:1fr}header{padding:20px}}
</style>
<header><h1>聚梦传媒 · 老师管理台</h1><div class="muted">本机版：管理 SOP 和学员权益。改动保存到本机数据库，不会自动部署到公网。</div><nav><button id="course-tab" class="active">SOP 管理</button><button id="student-tab">学员与额度</button><button id="reload">刷新数据</button></nav></header>
<div id="status" role="status" aria-live="polite"></div>
<section id="auth" class="auth hidden"><h2>进入老师后台</h2><p>请双击项目内 <b>server/data/打开老师后台.url</b>。快捷方式只供本机使用，请勿分享。</p><label>或填写本机后台口令</label><input id="key" type="password" autocomplete="off"><button id="unlock">进入</button></section>
<main id="workspace"><aside id="list"></aside><section id="editor"></section></main>
<script>
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let key=new URLSearchParams(location.hash.slice(1)).get('key')||sessionStorage.getItem('jumeng-admin')||'';
if(key){sessionStorage.setItem('jumeng-admin',key);history.replaceState(null,'',location.pathname)}
let tab='courses',courses=[],students=[],current=null,chosen=null,authMode='mock',working=false;
const cats={measure:'量房',start:'开工',case:'案例',meet:'谈单',inspect:'巡检'},states={inactive:'未开通',active:'使用中',expired:'已到期',exhausted:'额度已用完'};
const time=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'}):'未开通';
function message(v){$('status').textContent=v}
async function api(path,method='GET',data,raw=false){const r=await fetch('/api/'+path,{method,headers:{Authorization:'Bearer '+key,...(raw?{'Content-Type':data.type}:{'Content-Type':'application/json'})},body:data===undefined?undefined:raw?data:JSON.stringify(data)});const out=await r.json();if(!r.ok){if(r.status===401){$('auth').classList.remove('hidden');$('workspace').classList.add('hidden')}throw Error(out.error||'操作失败')}return out}
async function run(fn){if(working)return;working=true;$('workspace').inert=true;document.querySelectorAll('button').forEach(b=>b.disabled=true);try{await fn()}catch(e){message(e.message)}finally{working=false;$('workspace').inert=false;document.querySelectorAll('button').forEach(b=>b.disabled=false)}}
async function load(){if(!key){$('auth').classList.remove('hidden');$('workspace').classList.add('hidden');return}const [a,b]=await Promise.all([api('courses'),api('students')]);courses=a.items;students=b.items;authMode=b.authMode||'mock';$('auth').classList.add('hidden');$('workspace').classList.remove('hidden');renderList()}
function tabs(name){tab=name;current=null;chosen=null;$('course-tab').classList.toggle('active',name==='courses');$('student-tab').classList.toggle('active',name==='students');renderList();$('editor').innerHTML='<h2>'+ (name==='courses'?'SOP 管理':'学员与额度')+'</h2><p class="muted">在左侧选择要管理的内容，或点击新增。</p>'}
function renderList(){const items=tab==='courses'?courses:students;$('list').innerHTML='<button class="primary" data-new="1">'+(tab==='courses'?'新增 SOP':'新增学员')+'</button>'+items.map(x=>tab==='courses'?`<button class="list-item ${current?.id===x.id?'active':''}" data-course="${x.id}">${esc(x.lesson.name)}<small>${cats[x.category]} · ${x.published?x.changed?'已发布，有未发布修改':'已发布':'草稿 / 已下架'} · ${x.lesson.shots.length} 镜</small></button>`:`<button class="list-item ${chosen===x.owner?'active':''}" data-student="${esc(x.owner)}">${esc(x.label)}<small>${x.owner.startsWith('mock:')?'本机测试':'微信学员'} · ${x.enabled?states[x.status]:'已停用'} · 剩余 ${x.remaining} 次</small></button>`).join('')}
const blankShot=()=>({title:'',logic:'',where:'',frame:'',action:'',say:'',stop:'',check:'',ref:0,end:0,keep:0,clip:'',clipPoster:'',image:''});
function newCourse(){current={id:0,category:'measure',lesson:{id:0,name:'',task:'',need:'',takeaway:'',file:'',duration:0,shots:[blankShot()]}};renderList();renderCourse()}
function field(label,name,value,textarea=false,extra=''){return `<label>${label}</label><${textarea?'textarea':'input'} data-field="${name}" aria-label="${esc(label)}" ${extra} ${textarea?'':`value="${esc(value)}"`}>${textarea?esc(value):''}${textarea?'</textarea>':''}`}
function media(label,field,value,index){return `<label>${label}</label><input readonly value="${esc(value)}" aria-label="${label}路径"><input type="file" data-upload="${field}" ${index===undefined?'':`data-shot="${index}"`} accept="${field==='file'||field==='clip'?'video/mp4':'image/jpeg,image/png'}">`}
function renderCourse(){const l=current.lesson;$('editor').innerHTML=`<h2>${current.id?'编辑 SOP':'新增 SOP'}</h2><div class="notice">先保存草稿，再发布。编辑已发布课程不会立即影响学员。视频支持 MP4，图片支持 JPG/PNG，单文件上限 200 MB；媒体先存本机，公网使用另需配置 HTTPS 媒体托管。</div><div class="fields"><div>${field('案例名称','name',l.name)}</div><div><label>分类</label><select id="category">${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${k===current.category?'selected':''}>${v}</option>`).join('')}</select></div></div>${field('这条视频要让人看懂什么','task',l.task,true)}${field('整条视频的思路（小学生也能听懂）','takeaway',l.takeaway,true)}${field('拍摄前准备什么','need',l.need,true)}${media('完整参考视频','file',l.file)}${field('完整视频时长（秒，可先填 0）','duration',l.duration,false,'type="number" min="0"')}<h3>镜头内容</h3>${l.shots.map((s,i)=>`<section class="shot" data-index="${i}"><h3>参考镜头 ${i+1}<button data-remove="${i}">移除此镜</button></h3>${field('这一镜要表达什么','title',s.title)}${field('为什么这样拍','logic',s.logic,true)}<div class="fields">${[['站在哪里','where'],['手机对准哪里','frame'],['开始后做什么','action'],['IP 说什么或问什么','say'],['什么时候停止','stop'],['拍够的标准','check']].map(([label,k])=>'<div>'+field(label,k,s[k],true)+'</div>').join('')}</div>${media('参考片段（可留空）','clip',s.clip,i)}${media('片段封面（可留空）','clipPoster',s.clipPoster,i)}</section>`).join('')}<button id="add-shot">增加一个镜头</button><div class="toolbar"><button class="primary" id="save-course">保存草稿</button>${current.id?'<button id="publish-course">保存并发布</button><button id="unpublish-course">下架</button>':''}</div><p class="muted">暂不自动拆分视频或生成 SOP。可先发布纯文字版本；没有视频的镜头会显示文字阅读提示。</p>`}
function renderStudent(){const s=students.find(x=>x.owner===chosen);if(!s)return;const m=s.membership;$('editor').innerHTML=`<h2>${esc(s.label)}</h2><p class="muted">${s.owner.startsWith('mock:')?'本机测试身份，不是真实微信学员':'微信学员'} · ${s.enabled?'允许使用':'已停用'} · ${states[s.status]}</p><div class="stats"><div><small>套餐剩余</small><b>${s.remaining} 次</b></div><div><small>本期已用</small><b>${m?.used||0} 次</b></div><div><small>今日已用 / 上限</small><b>${s.todayUsed} / ${s.dailyLimit}</b></div></div><p>有效至：${time(m?.expiresAt)}（北京时间）</p><h3>开通、续期或补次数</h3><p class="muted">只续期：次数填 0。只补次数：天数填 0，会员须仍有效。未到期从原日期延长；已到期重新起算，旧余额不结转。</p><div class="fields"><div><label>增加天数</label><input id="days" type="number" min="0" max="3650" value="30"></div><div><label>增加次数</label><input id="quota" type="number" min="0" max="1000000" value="100"></div></div><label>权益名称 / 操作备注</label><input id="grant-label" value="学员权益"><div class="toolbar"><button class="primary" id="grant">确认开通 / 增加</button><button id="toggle-enabled">${s.enabled?'停用账号':'恢复账号'}</button></div><h3>最近使用记录</h3><table><thead><tr><th>时间</th><th>结果</th><th>消耗</th></tr></thead><tbody>${s.records.map(r=>`<tr><td>${time(r.at)}</td><td>${esc(({running:'生成中',completed:'完成',stopped:'停止',failed:'失败'})[r.status]||r.status)}${r.mode==='mock'?'（模拟）':''}</td><td>${r.charged} 次</td></tr>`).join('')||'<tr><td colspan="3">暂无记录</td></tr>'}</tbody></table><h3>开通与调整记录</h3><table><tbody>${(s.grants||[]).map(g=>`<tr><td>${time(g.at)}</td><td>${esc(g.label)}</td><td>+${g.days} 天 / +${g.quota} 次</td></tr>`).join('')||'<tr><td>暂无调整记录</td></tr>'}</tbody></table>`}
function newStudent(){$('editor').innerHTML=`<h2>新增学员</h2><p class="muted">微信标识必须是本小程序取得的 OpenID，不能填手机号或微信号。当前服务身份模式：${authMode==='mock'?'本机模拟':'微信身份'}。</p><label>备注姓名</label><input id="student-label"><label>身份类型</label><select id="student-kind"><option value="wechat">真实微信学员</option>${authMode==='mock'?'<option value="mock" selected>本机测试设备</option>':''}</select><label>OpenID / 模拟设备标识</label><input id="identity" autocomplete="off"><p class="muted">模拟标识在开发者工具控制台执行 wx.getStorageSync('jumeng:mockDevice') 获取。新增账号只授予准入权限，AI 期限和次数需另外开通。</p><button class="primary" id="save-student">保存学员</button>`}
async function saveCourse(){const saved=await api('courses','POST',current);current.id=saved.id;current.lesson=saved;await load();return saved}
$('course-tab').onclick=()=>tabs('courses');$('student-tab').onclick=()=>tabs('students');$('reload').onclick=()=>run(async()=>{await load();if(chosen)renderStudent();message('已刷新')});$('unlock').onclick=()=>{key=$('key').value.trim();sessionStorage.setItem('jumeng-admin',key);run(load)};
$('list').onclick=e=>{if(working)return;const b=e.target.closest('button');if(!b)return;if(b.dataset.new){tab==='courses'?newCourse():newStudent()}if(b.dataset.course){current=structuredClone(courses.find(x=>x.id===Number(b.dataset.course)));renderList();renderCourse()}if(b.dataset.student){chosen=b.dataset.student;renderList();renderStudent()}};
$('editor').oninput=e=>{if(!current)return;const input=e.target;if(input.id==='category'){current.category=input.value;return}if(!input.dataset.field)return;const shot=input.closest('[data-index]');(shot?current.lesson.shots[Number(shot.dataset.index)]:current.lesson)[input.dataset.field]=input.dataset.field==='duration'?Number(input.value):input.value};
$('editor').onchange=e=>{const input=e.target;if(input.id==='category'&&current)current.category=input.value;if(!input.dataset.upload||!input.files?.[0])return;const file=input.files[0],field=input.dataset.upload,index=input.dataset.shot;run(async()=>{message('正在上传文件…');const r=await api('upload?kind='+(field==='clip'||field==='clipPoster'?'clips':field==='file'?'videos':'assets'),'POST',file,true);(index===undefined?current.lesson:current.lesson.shots[Number(index)])[field]=r.key;renderCourse();message('文件已上传；请保存草稿')})};
$('editor').onclick=e=>{if(working)return;const b=e.target.closest('button');if(!b)return;if(b.dataset.remove!==undefined){if(current.lesson.shots.length===1)return message('至少保留一个镜头');current.lesson.shots.splice(Number(b.dataset.remove),1);renderCourse();return}if(b.id==='add-shot'){current.lesson.shots.push(blankShot());renderCourse();return}run(async()=>{
if(b.id==='save-course'){await saveCourse();renderCourse();message('草稿已保存，学员看到的内容尚未改变')}
if(b.id==='publish-course'){await saveCourse();await api('courses/'+current.id+'/publish','POST',{});await load();renderCourse();message('已发布，小程序重新进入 SOP 页即可读取')}
if(b.id==='unpublish-course'){await api('courses/'+current.id+'/unpublish','POST',{});await load();renderCourse();message('已下架；草稿保留')}
if(b.id==='save-student'){const r=await api('students','POST',{label:$('student-label').value,identity:$('identity').value,kind:$('student-kind').value});chosen=r.owner;await load();renderStudent();message('学员已保存，可继续开通权益')}
if(b.id==='grant'){const data={days:Number($('days').value),quota:Number($('quota').value),label:$('grant-label').value};await api('students/'+chosen+'/grant','POST',data);await load();renderStudent();message('权益已更新，学员刷新会员页即可看到')}
if(b.id==='toggle-enabled'){const s=students.find(x=>x.owner===chosen);await api('students/'+chosen+'/enabled','POST',{enabled:!s.enabled});await load();renderStudent();message('账号权限已更新')}
})};
run(async()=>{await load();if(key)tabs('courses')});
</script></html>
